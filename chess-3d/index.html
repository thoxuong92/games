<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-visual, user-scalable=no, viewport-fit=cover">
    <title>Chess 3D</title>
    <link rel="icon" href="icon.png">
    
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        canvas { width: 100%; height: 100%; display: block; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; color: rgba(255,255,255,.7); font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #loading::before { content: ""; width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="app-canvas"></canvas>
    <div id="loading"></div>
    <script src="game.js?v=728955a4"></script>
<script src="joukyuu-home.js"></script>
</body>
</html>
